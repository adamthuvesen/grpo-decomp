[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpo-decomp"
version = "0.1.0"
description = "Controls-first tool for analyzing what drives GRPO gains."
readme = "README.md"
# Python 3.13, not 3.14: the Modal image's locked vllm 0.17.1 pulls numba 0.61, llvmlite 0.44,
# outlines-core and xgrammar, which have no cp314 wheels (2026-11-06).
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Adam Thuvesen", email = "adam.thuvesen@mentimeter.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.7,<3",
    "datasets>=3.0",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    # The verifiable reward engine. Core (not train) so the reward/eval layer is
    # testable on a CPU box without the GPU stack. Pinned — its parser moves.
    "math-verify==0.9.0",
    "pyyaml>=6",
]

# Training and rollout are GPU-only and heavy; kept out of the default install so
# the eval/analysis layer can run on a cheap box. Pin TRL — its GRPO defaults move.
[project.optional-dependencies]
# Completion generation for the eval battery. transformers+torch only, so the
# base-model short local check installs on a Mac/CPU box (no CUDA, no vLLM). The vLLM
# GPU backend is imported lazily and ships with `train`.
generate = [
    "transformers>=4.48",
    "torch>=2.4",
]
train = [
    "grpo-decomp[generate]",
    "trl==1.0.0",
    # TRL 1.0.0 supports vLLM 0.10.2–0.17.1; an out-of-range vLLM warns and risks
    # rollout/log-prob drift in GRPO colocate. Pin to the top of the supported window.
    "vllm==0.17.1",
    "wandb>=0.17",
]
eval = [
    "polars>=1.0,<2",
    # The stats layer: paired bootstrap CIs + multiplicity correction. Not on
    # PyPI, so pinned to an immutable commit. McNemar / exact-binomial / effect
    # size are implemented locally (eval-audit does not provide them).
    "eval-audit @ git+https://github.com/adamthuvesen/eval-audit@6690f493033094a6ced9a749d57a714c383f8a87",
]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.4",
    "pre-commit>=3.8",
    # The Modal launcher CLI (`modal run modal_app.py`). A dev/launch tool, not a
    # runtime dep the GPU image installs — the image bakes only the `train` extra.
    # Pinned to the surface modal_app.py targets (modal.App / string GPU / spawn-by-default).
    "modal==1.5.0",
    "basedpyright==1.40.2",
    "types-pyyaml>=6.0.12.20260518",
    "import-linter>=2.15",
    "matplotlib==3.11.0",
]

[project.scripts]
grpo-decomp = "llm_grpo_gains.cli:main"
grpo-study = "llm_grpo_gains.workflows:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "N", "PTH", "RUF", "PGH003", "PGH004", "TID251"]
ignore = ["E501"]

# Whole-module bans. A per-file TID251 ignore lifts every ban for that file, so
# tests/test_banned_modules.py holds each owner to the modules it owns.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run processes only in an owner file, such as src/grpo_decomp/provenance.py for git calls. To add an owner, list the file in OWNERS in tests/test_banned_modules.py and give it a TID251 per-file-ignore in pyproject.toml."

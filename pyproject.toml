# Owners of a banned module (see tests/test_banned_modules.py::OWNERS).
[tool.ruff.lint.per-file-ignores]
"src/grpo_decomp/provenance.py" = ["TID251"]
"src/grpo_decomp/train/launcher.py" = ["TID251"]
"src/llm_grpo_gains/data/gsm8k.py" = ["TID251"]
"src/llm_grpo_gains/data/gsm8k_platinum.py" = ["TID251"]
"src/llm_grpo_gains/data/gsm_plus.py" = ["TID251"]
"src/llm_grpo_gains/data/gsm_symbolic.py" = ["TID251"]
"src/llm_grpo_gains/workflows.py" = ["TID251"]
"modal_app.py" = ["TID251"]
"tests/test_architecture.py" = ["TID251"]
"tests/test_esme_countdown_decomp.py" = ["TID251"]
"tests/test_packaging.py" = ["TID251"]
"tests/test_strict_mode.py" = ["TID251"]
".agents/skills/verify-grpo-decomp/drives.py" = ["TID251"]
".agents/skills/verify-grpo-decomp/launch_plan.py" = ["TID251"]
".agents/skills/verify-grpo-decomp/verify" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["grpo_decomp", "llm_grpo_gains"]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.13"
include = ["src/grpo_decomp", "src/llm_grpo_gains", "scripts", "tests", "modal_app.py"]
exclude = ["**/__pycache__", ".venv", ".verify"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -m 'not integration and not gpu and not slow'"
strict_markers = true
markers = [
    "slow: offline but too slow for the fast lane; runs in make slow",
    "integration: hits the network / HuggingFace; deselected by default",
    "gpu: requires explicit local CUDA hardware and generate dependencies",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grpo_decomp", "src/llm_grpo_gains"]

# Required for the eval-audit git dependency (not published to PyPI).
[tool.hatch.metadata]
allow-direct-references = true

[tool.importlinter]
root_packages = ["grpo_decomp", "llm_grpo_gains"]

[[tool.importlinter.contracts]]
name = "grpo_decomp must not import llm_grpo_gains; move shared code down into grpo_decomp"
type = "forbidden"
source_modules = ["grpo_decomp"]
forbidden_modules = ["llm_grpo_gains"]

[[tool.importlinter.contracts]]
name = "grpo_decomp modules import only lower layers; move shared code to a lower layer such as schemas"
type = "layers"
containers = ["grpo_decomp"]
exhaustive = true
layers = [
    "cli | jobs",
    "report",
    "eval | train",
    "rewards | prompts",
    "registries",
    "stats | splits | provenance | grading",
    "schemas",
]

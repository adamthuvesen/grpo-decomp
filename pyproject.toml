[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpo-decomp"
version = "0.1.0"
description = "Controls-first tool for analyzing what drives GRPO gains."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Adam Thuvesen", email = "adam.thuvesen@mentimeter.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.7,<3",
    "datasets>=3.0",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    # The verifiable reward engine. Core (not train) so the reward/eval layer is
    # testable on a CPU box without the GPU stack. Pinned — its parser moves.
    "math-verify==0.9.0",
    "pyyaml>=6",
]

# Training and rollout are GPU-only and heavy; kept out of the default install so
# the eval/analysis layer can run on a cheap box. Pin TRL — its GRPO defaults move.
[project.optional-dependencies]
# Completion generation for the eval battery. transformers+torch only, so the
# base-model short local check installs on a Mac/CPU box (no CUDA, no vLLM). The vLLM
# GPU backend is imported lazily and ships with `train`.
generate = [
    "transformers>=4.48",
    "torch>=2.4",
]
train = [
    "grpo-decomp[generate]",
    "trl==1.0.0",
    # TRL 1.0.0 supports vLLM 0.10.2–0.17.1; an out-of-range vLLM warns and risks
    # rollout/log-prob drift in GRPO colocate. Pin to the top of the supported window.
    "vllm==0.17.1",
    "wandb>=0.17",
]
eval = [
    "polars>=1.0,<2",
    # The stats layer: paired bootstrap CIs + multiplicity correction. Not on
    # PyPI, so pinned to an immutable commit. McNemar / exact-binomial / effect
    # size are implemented locally (eval-audit does not provide them).
    "eval-audit @ git+https://github.com/adamthuvesen/eval-audit@6690f493033094a6ced9a749d57a714c383f8a87",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
    # The Modal launcher CLI (`modal run modal_app.py`). A dev/launch tool, not a
    # runtime dep the GPU image installs — the image bakes only the `train` extra.
    # Pinned to the surface modal_app.py targets (modal.App / string GPU / spawn-by-default).
    "modal==1.5.0",
]

[project.scripts]
grpo-decomp = "grpo_decomp.eval.cli:main"

# The reference study registers its datasets/rewards/task profiles into the harness via
# this entry point; the harness discovers it at runtime (see grpo_decomp.plugins) without
# importing the study, keeping the dependency one-way.
[project.entry-points."grpo_decomp.plugins"]
gsm8k = "llm_grpo_gains.registration:register"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "N", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["grpo_decomp", "llm_grpo_gains"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: hits the network / HuggingFace; deselected by default",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grpo_decomp", "src/llm_grpo_gains"]

# Required for the eval-audit git dependency (not published to PyPI).
[tool.hatch.metadata]
allow-direct-references = true

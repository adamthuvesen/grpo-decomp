<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Countdown expansion positive control</title>
  <desc id="desc">Countdown-focused chart showing a large placebo comparison and pass@8 coverage expansion, with GSM8K shown as a small reference.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #d9dde7; stroke-width: 1; }
    .title { fill: #1f2937; font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .subtitle { fill: #6b7280; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .axis { stroke: #cfd5df; stroke-width: 1; }
    .grid { stroke: #eef1f6; stroke-width: 1; }
    .tick { fill: #6b7280; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .label { fill: #374151; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .value { fill: #1f2937; font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .small { fill: #6b7280; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .legend { fill: #374151; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
  <rect class="bg" width="920" height="620" rx="10"/>
  <rect class="panel" x="28" y="24" width="864" height="560" rx="8"/>

  <text class="title" x="56" y="64">Countdown: what expansion looks like</text>
  <text class="subtitle" x="56" y="88">The same decomposition reports a large gain when pass@8 coverage really moves.</text>

  <g transform="translate(82 142)">
    <text class="label" x="0" y="0">Correct reward vs random reward</text>
    <text class="small" x="0" y="24">placebo comparison, percentage points</text>
    <line class="grid" x1="0" y1="300" x2="350" y2="300"/>
    <line class="grid" x1="0" y1="235" x2="350" y2="235"/>
    <line class="grid" x1="0" y1="170" x2="350" y2="170"/>
    <line class="grid" x1="0" y1="105" x2="350" y2="105"/>
    <line class="grid" x1="0" y1="40" x2="350" y2="40"/>
    <line class="axis" x1="0" y1="40" x2="0" y2="300"/>
    <line class="axis" x1="0" y1="300" x2="350" y2="300"/>
    <text class="tick" x="-24" y="304" text-anchor="end">0</text>
    <text class="tick" x="-24" y="239" text-anchor="end">15</text>
    <text class="tick" x="-24" y="174" text-anchor="end">30</text>
    <text class="tick" x="-24" y="109" text-anchor="end">45</text>
    <text class="tick" x="-24" y="44" text-anchor="end">60</text>
    <rect x="72" y="283.1" width="58" height="16.9" fill="#aeb6ff" rx="4"/>
    <rect x="214" y="98.5" width="82" height="201.5" fill="#ef553b" rx="4"/>
    <text class="value" x="101" y="270" text-anchor="middle">+3.9</text>
    <text class="value" x="255" y="84" text-anchor="middle">+46.5</text>
    <text class="label" x="101" y="330" text-anchor="middle">GSM8K</text>
    <text class="label" x="255" y="330" text-anchor="middle">Countdown</text>
  </g>

  <g transform="translate(512 142)">
    <text class="label" x="0" y="0">pass@8 coverage</text>
    <text class="small" x="0" y="24">base model to RL-trained model</text>
    <line class="grid" x1="0" y1="300" x2="310" y2="300"/>
    <line class="grid" x1="0" y1="235" x2="310" y2="235"/>
    <line class="grid" x1="0" y1="170" x2="310" y2="170"/>
    <line class="grid" x1="0" y1="105" x2="310" y2="105"/>
    <line class="grid" x1="0" y1="40" x2="310" y2="40"/>
    <line class="axis" x1="0" y1="40" x2="0" y2="300"/>
    <line class="axis" x1="0" y1="300" x2="310" y2="300"/>
    <text class="tick" x="-24" y="304" text-anchor="end">0%</text>
    <text class="tick" x="-24" y="239" text-anchor="end">25%</text>
    <text class="tick" x="-24" y="174" text-anchor="end">50%</text>
    <text class="tick" x="-24" y="109" text-anchor="end">75%</text>
    <text class="tick" x="-24" y="44" text-anchor="end">100%</text>

    <line x1="64" y1="55.7" x2="112" y2="53.8" stroke="#aeb6ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="64" cy="55.7" r="7" fill="#00cc96"/><circle cx="112" cy="53.8" r="7" fill="#ef553b"/>
    <text class="small" x="88" y="78" text-anchor="middle">GSM8K +0.7 pp</text>
    <text class="label" x="88" y="330" text-anchor="middle">GSM8K</text>

    <line x1="198" y1="160.7" x2="268" y2="54.0" stroke="#ef553b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="198" cy="160.7" r="8" fill="#00cc96"/><circle cx="268" cy="54.0" r="8" fill="#ef553b"/>
    <text class="value" x="276" y="138" text-anchor="start">+41.0 pp</text>
    <text class="small" x="276" y="158" text-anchor="start">53.6% -> 94.6%</text>
    <text class="label" x="233" y="330" text-anchor="middle">Countdown</text>
  </g>

  <g transform="translate(546 520)">
    <rect x="0" y="-10" width="12" height="12" fill="#00cc96" rx="2"/><text class="legend" x="18" y="1">base pass@8</text>
    <rect x="126" y="-10" width="12" height="12" fill="#ef553b" rx="2"/><text class="legend" x="144" y="1">RL pass@8</text>
  </g>
  <text class="small" x="56" y="558">Countdown is the positive control: when RL adds coverage, the decomposition shows expansion rather than elicitation.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">GSM8K and Countdown contrast</title>
  <desc id="desc">Two-panel chart comparing placebo gains and pass@8 coverage movement on GSM8K and Countdown.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #d9dde7; stroke-width: 1; }
    .title { fill: #1f2937; font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .subtitle { fill: #6b7280; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .axis { stroke: #cfd5df; stroke-width: 1; }
    .grid { stroke: #eef1f6; stroke-width: 1; }
    .tick { fill: #6b7280; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .label { fill: #374151; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .value { fill: #1f2937; font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .small { fill: #6b7280; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .legend { fill: #374151; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
  <rect class="bg" width="920" height="620" rx="10"/>
  <rect class="panel" x="28" y="24" width="864" height="560" rx="8"/>

  <text class="title" x="56" y="64">Same test, opposite verdicts</text>
  <text class="subtitle" x="56" y="88">GSM8K is mostly elicitation; Countdown is a positive control where pass@8 coverage expands.</text>

  <g transform="translate(86 140)">
    <text class="label" x="0" y="0">Placebo comparison</text>
    <text class="small" x="0" y="24">correct reward - random reward</text>
    <line class="grid" x1="0" y1="300" x2="330" y2="300"/>
    <line class="grid" x1="0" y1="235" x2="330" y2="235"/>
    <line class="grid" x1="0" y1="170" x2="330" y2="170"/>
    <line class="grid" x1="0" y1="105" x2="330" y2="105"/>
    <line class="grid" x1="0" y1="40" x2="330" y2="40"/>
    <line class="axis" x1="0" y1="40" x2="0" y2="300"/>
    <line class="axis" x1="0" y1="300" x2="330" y2="300"/>
    <text class="tick" x="-26" y="304" text-anchor="end">0</text>
    <text class="tick" x="-26" y="239" text-anchor="end">15</text>
    <text class="tick" x="-26" y="174" text-anchor="end">30</text>
    <text class="tick" x="-26" y="109" text-anchor="end">45</text>
    <text class="tick" x="-26" y="44" text-anchor="end">60 pp</text>
    <rect x="80" y="283.1" width="64" height="16.9" fill="#636efa" rx="4"/>
    <rect x="210" y="98.5" width="64" height="201.5" fill="#ef553b" rx="4"/>
    <text class="value" x="112" y="270" text-anchor="middle">+3.9</text>
    <text class="value" x="242" y="84" text-anchor="middle">+46.5</text>
    <text class="label" x="112" y="330" text-anchor="middle">GSM8K</text>
    <text class="label" x="242" y="330" text-anchor="middle">Countdown</text>
  </g>

  <g transform="translate(520 140)">
    <text class="label" x="0" y="0">pass@8 coverage movement</text>
    <text class="small" x="0" y="24">base coverage to RL coverage</text>
    <line class="grid" x1="0" y1="300" x2="300" y2="300"/>
    <line class="grid" x1="0" y1="235" x2="300" y2="235"/>
    <line class="grid" x1="0" y1="170" x2="300" y2="170"/>
    <line class="grid" x1="0" y1="105" x2="300" y2="105"/>
    <line class="grid" x1="0" y1="40" x2="300" y2="40"/>
    <line class="axis" x1="0" y1="40" x2="0" y2="300"/>
    <line class="axis" x1="0" y1="300" x2="300" y2="300"/>
    <text class="tick" x="-24" y="304" text-anchor="end">0%</text>
    <text class="tick" x="-24" y="239" text-anchor="end">25%</text>
    <text class="tick" x="-24" y="174" text-anchor="end">50%</text>
    <text class="tick" x="-24" y="109" text-anchor="end">75%</text>
    <text class="tick" x="-24" y="44" text-anchor="end">100%</text>
    <line x1="74" y1="55.7" x2="130" y2="53.8" stroke="#636efa" stroke-width="4" stroke-linecap="round"/>
    <circle cx="74" cy="55.7" r="7" fill="#00cc96"/><circle cx="130" cy="53.8" r="7" fill="#ef553b"/>
    <text class="value" x="102" y="78" text-anchor="middle">+0.7 pp</text>
    <text class="label" x="102" y="330" text-anchor="middle">GSM8K</text>
    <line x1="202" y1="160.7" x2="258" y2="54.0" stroke="#ef553b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="202" cy="160.7" r="7" fill="#00cc96"/><circle cx="258" cy="54.0" r="7" fill="#ef553b"/>
    <text class="value" x="270" y="145" text-anchor="start">+41.0 pp</text>
    <text class="label" x="230" y="330" text-anchor="middle">Countdown</text>
  </g>

  <g transform="translate(550 520)">
    <rect x="0" y="-10" width="12" height="12" fill="#00cc96" rx="2"/><text class="legend" x="18" y="1">base pass@8</text>
    <rect x="126" y="-10" width="12" height="12" fill="#ef553b" rx="2"/><text class="legend" x="144" y="1">RL pass@8</text>
  </g>
  <text class="small" x="56" y="558">The same decomposition reports expansion when coverage actually moves; it is not tuned to call every RL gain fake.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
  <title id="title">GSM8K and Countdown contrast</title>
  <desc id="desc">Two-panel chart comparing placebo gains and pass@8 coverage movement on GSM8K and Countdown.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #d9dde7; stroke-width: 1; }
    .title { fill: #1f2937; font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .subtitle { fill: #6b7280; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .axis { stroke: #cfd5df; stroke-width: 1; }
    .grid { stroke: #eef1f6; stroke-width: 1; }
    .tick { fill: #6b7280; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .label { fill: #374151; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .value { fill: #1f2937; font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .small { fill: #6b7280; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .legend { fill: #374151; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
  <rect class="bg" width="920" height="540" rx="10"/>
  <rect class="panel" x="28" y="24" width="864" height="488" rx="8"/>

  <text class="title" x="56" y="64">Same test, opposite verdicts</text>
  <text class="subtitle" x="56" y="88">GSM8K is mostly elicitation; Countdown is a positive control where pass@8 coverage expands.</text>

  <g transform="translate(74 126)">
    <text class="label" x="0" y="0">Placebo comparison</text>
    <text class="small" x="0" y="22">correct reward - random reward</text>
    <line class="grid" x1="0" y1="270" x2="340" y2="270"/>
    <line class="grid" x1="0" y1="210" x2="340" y2="210"/>
    <line class="grid" x1="0" y1="150" x2="340" y2="150"/>
    <line class="grid" x1="0" y1="90" x2="340" y2="90"/>
    <line class="grid" x1="0" y1="30" x2="340" y2="30"/>
    <line class="axis" x1="0" y1="30" x2="0" y2="270"/>
    <line class="axis" x1="0" y1="270" x2="340" y2="270"/>
    <text class="tick" x="-34" y="274">0</text>
    <text class="tick" x="-44" y="214">15</text>
    <text class="tick" x="-44" y="154">30</text>
    <text class="tick" x="-44" y="94">45</text>
    <text class="tick" x="-48" y="34">60 pp</text>
    <rect x="82" y="254.2" width="64" height="15.8" fill="#636efa" rx="4"/>
    <rect x="210" y="83.9" width="64" height="186.1" fill="#ef553b" rx="4"/>
    <text class="value" x="114" y="242" text-anchor="middle">+3.9</text>
    <text class="value" x="242" y="72" text-anchor="middle">+46.5</text>
    <text class="label" x="114" y="300" text-anchor="middle">GSM8K</text>
    <text class="label" x="242" y="300" text-anchor="middle">Countdown</text>
  </g>

  <g transform="translate(510 126)">
    <text class="label" x="0" y="0">pass@8 coverage movement</text>
    <text class="small" x="0" y="22">base coverage to RL coverage</text>
    <line class="grid" x1="0" y1="270" x2="330" y2="270"/>
    <line class="grid" x1="0" y1="210" x2="330" y2="210"/>
    <line class="grid" x1="0" y1="150" x2="330" y2="150"/>
    <line class="grid" x1="0" y1="90" x2="330" y2="90"/>
    <line class="grid" x1="0" y1="30" x2="330" y2="30"/>
    <line class="axis" x1="0" y1="30" x2="0" y2="270"/>
    <line class="axis" x1="0" y1="270" x2="330" y2="270"/>
    <text class="tick" x="-34" y="274">0%</text>
    <text class="tick" x="-40" y="214">25%</text>
    <text class="tick" x="-40" y="154">50%</text>
    <text class="tick" x="-40" y="94">75%</text>
    <text class="tick" x="-46" y="34">100%</text>
    <line x1="80" y1="44.5" x2="152" y2="42.7" stroke="#636efa" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="44.5" r="7" fill="#00cc96"/><circle cx="152" cy="42.7" r="7" fill="#ef553b"/>
    <text class="value" x="116" y="24" text-anchor="middle">+0.7 pp</text>
    <text class="label" x="116" y="300" text-anchor="middle">GSM8K</text>
    <line x1="214" y1="141.4" x2="286" y2="42.9" stroke="#ef553b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="214" cy="141.4" r="7" fill="#00cc96"/><circle cx="286" cy="42.9" r="7" fill="#ef553b"/>
    <text class="value" x="250" y="124" text-anchor="middle">+41.0 pp</text>
    <text class="label" x="250" y="300" text-anchor="middle">Countdown</text>
  </g>

  <g transform="translate(548 462)">
    <rect x="0" y="-10" width="12" height="12" fill="#00cc96" rx="2"/><text class="legend" x="18" y="1">base pass@8</text>
    <rect x="126" y="-10" width="12" height="12" fill="#ef553b" rx="2"/><text class="legend" x="144" y="1">RL pass@8</text>
  </g>
  <text class="small" x="56" y="490">The same decomposition reports expansion when coverage actually moves; it is not tuned to call every RL gain fake.</text>
</svg>
